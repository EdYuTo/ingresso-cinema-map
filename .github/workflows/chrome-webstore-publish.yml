name: Chrome Web Store Publish

# Manual only — publishes the current manifest.json version to the Chrome
# Web Store without touching the git tag, GitHub Release, or Firefox
# Add-ons. Use this to retry the Chrome step in isolation, or to release
# to Chrome only without also publishing to Firefox.
on:
  workflow_dispatch:

concurrency:
  group: chrome-webstore-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Upload & publish to Chrome Web Store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension zip
        run: npm run package

      - name: Upload extension package
        run: |
          ZIP_FILE=$(ls dist/*.zip | head -n 1)
          echo "Uploading ${ZIP_FILE}"
          npx chrome-webstore-upload upload --source "${ZIP_FILE}"
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}

      - name: Publish extension
        run: npx chrome-webstore-upload publish
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
