name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

jobs:
  extension-tests:
    name: Fixture integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: Run fixture tests
        run: xvfb-run --auto-servernum --server-args='-screen 0 1360x900x24' npm test
        env:
          CI: true

  publish:
    name: Upload to Chrome Web Store
    runs-on: ubuntu-latest
    needs: extension-tests
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension zip
        run: npm run package

      - name: Upload extension package
        run: |
          ZIP_FILE=$(ls dist/*.zip | head -n 1)
          echo "Uploading ${ZIP_FILE}"
          npx chrome-webstore-upload upload --source "${ZIP_FILE}"
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}

      - name: Publish extension
        run: npx chrome-webstore-upload publish
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
