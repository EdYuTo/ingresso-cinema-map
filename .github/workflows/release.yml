name: Release

# Manual only — bump manifest.json version, merge to main, then run this workflow.
on:
  workflow_dispatch:
    inputs:
      skip_store:
        description: 'Skip Chrome Web Store upload (tag + GitHub Release only)'
        type: boolean
        default: true
      store_only:
        description: 'Retry Chrome Web Store upload only (tag + GitHub Release must already exist)'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extension-tests:
    name: Fixture integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: Run fixture tests
        run: xvfb-run --auto-servernum --server-args='-screen 0 1360x900x24' npm test
        env:
          CI: true

  release:
    name: Tag, GitHub Release, Chrome Web Store
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: extension-tests
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify release tag exists
        if: inputs.store_only
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} not found. Run a full release first (with Skip store checked)."
            exit 1
          fi

      - name: Generate release notes
        if: ${{ !inputs.store_only }}
        run: npm run release-notes
        env:
          RELEASE_NOTES_ALLOW_EXISTING_TAG: ${{ github.run_attempt > 1 && '1' || '' }}

      - name: Build extension zip
        run: npm run package

      - name: Create annotated tag
        if: ${{ !inputs.store_only }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -F dist/release-notes.md
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.store_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping."
          else
            ZIP=$(ls dist/*.zip | head -n 1)
            gh release create "$TAG" "$ZIP" \
              --title "$TAG" \
              --notes-file dist/release-notes.md
          fi

      - name: Chrome Web Store release notes
        if: ${{ !inputs.store_only }}
        run: |
          {
            echo "## Chrome Web Store release notes"
            echo ""
            echo "The API cannot set per-version release notes. Copy the text below into the Developer Dashboard when submitting:"
            echo ""
            echo '```'
            cat dist/release-notes-store.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload extension package
        if: ${{ inputs.store_only || !inputs.skip_store }}
        run: |
          ZIP_FILE=$(ls dist/*.zip | head -n 1)
          echo "Uploading ${ZIP_FILE}"
          npx chrome-webstore-upload upload --source "${ZIP_FILE}"
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}

      - name: Publish extension
        if: ${{ inputs.store_only || !inputs.skip_store }}
        run: npx chrome-webstore-upload publish
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}

      - name: Upload release notes artifact
        if: ${{ !inputs.store_only }}
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-v${{ steps.version.outputs.value }}
          path: |
            dist/release-notes.md
            dist/release-notes-store.txt
